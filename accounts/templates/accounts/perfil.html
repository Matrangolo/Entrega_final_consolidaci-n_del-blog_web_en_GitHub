
{% extends 'posts/base.html' %}

{% block titulo %}Mi perfil - Mi Blog{% endblock %}

{% block contenido %}

<div class="tarjeta">

    <h2>Mi perfil</h2>

    <p><strong>Usuario:</strong> {{ user.username }}</p>

    <p>
        <strong>Email:</strong>
        {{ user.email|default:"No especificado" }}
    </p>

    <p>
        <strong>Fecha de registro:</strong>
        {{ user.date_joined|date:"d/m/Y" }}
    </p>

    <a class="boton" href="{% url 'lista_posts' %}">
        Volver al blog
    </a>

</div>

{% endblock %}
